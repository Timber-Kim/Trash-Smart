# 튜토리얼 하드코딩 값들을 yaml로 추출
data:
  data_dir: data
  num_classes: 15

model:
  name: resnet50          # 'resnet50' 또는 'efficientnet_b0'
  feature_extract: false  # false=fine-tuning(전체 학습), true=feature extraction(backbone 동결)

training:
  num_epochs: 5            # 추가 학습 epoch 수
  batch_size: 32
  lr: 0.00001              # resume 시 낮은 LR (기존 가중치 보존)
  step_size: 7             # 5 epoch 동안 감소 없음 → 고정 LR 효과
  num_workers: 0           # Windows에서는 0 권장 (멀티프로세싱 이슈)

augmentation:
  random_resized_crop: true
  random_horizontal_flip: true
  random_vertical_flip: false
  random_rotation: 15     # 회전 각도 (0이면 비활성화)
  color_jitter: true
  random_grayscale: true
  gaussian_blur: true
